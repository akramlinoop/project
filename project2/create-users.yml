---
- name: adding users
  hosts: dev
  become: true
  vars_files:
          - user.yml
  tasks:
          - name: create users via loop
            ansible.builtin.user:
                name: "{{ item.name }}"
                comment: "{{ item.first | capitalize }}{{ item.middle | default('') }}{{ item.last | capitalize }}"
                uid: "{{ item.uid }}"
                password: "{{ lookup('ansible.builtin.password', './password-{{ item.name }} length=6') | password_hash('sha512')}}"
                update_password: on_create
                state: present
            loop: "{{ myusers }}"


